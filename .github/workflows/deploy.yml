name: Deploy Websites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            fitness-site/package-lock.json
            leetcode-prep/package-lock.json
            tech-newsletter/package-lock.json

      # Build portfolio website
      - name: Install portfolio dependencies
        working-directory: website
        run: npm install

      - name: Build portfolio
        working-directory: website
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.COPILOT_API_KEY }}
        run: npm run build

      # Build fitness site
      - name: Install fitness site dependencies
        working-directory: fitness-site
        run: npm install

      - name: Build fitness site
        working-directory: fitness-site
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.COPILOT_API_KEY }}
        run: npm run build

      # Build leetcode-prep site
      - name: Install leetcode-prep dependencies
        working-directory: leetcode-prep
        run: npm install

      - name: Build leetcode-prep
        working-directory: leetcode-prep
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.COPILOT_API_KEY }}
        run: npm run build

      # Build tech-newsletter site
      - name: Install tech-newsletter dependencies
        working-directory: tech-newsletter
        run: npm install

      - name: Build tech-newsletter
        working-directory: tech-newsletter
        run: npm run build

      # Merge both builds into a single artifact
      - name: Merge build outputs
        run: |
          mkdir -p _site
          cp -r website/dist/* _site/
          mkdir -p _site/fitness
          cp -r fitness-site/dist/* _site/fitness/
          mkdir -p _site/leetcode-prep
          cp -r leetcode-prep/dist/* _site/leetcode-prep/
          mkdir -p _site/tech-newsletter
          cp -r tech-newsletter/dist/* _site/tech-newsletter/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

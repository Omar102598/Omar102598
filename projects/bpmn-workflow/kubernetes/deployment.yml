apiVersion: apps/v1
kind: Deployment
metadata:
  name: bpmn-workflow-backend
  namespace: bpmn-workflow
  labels:
    app: bpmn-workflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bpmn-workflow-backend
  template:
    metadata:
      labels:
        app: bpmn-workflow-backend
    spec:
      containers:
        - name: bpmn-workflow-backend
          image: portfolio/bpmn-workflow-backend:1.0.0
          ports:
            - containerPort: 8085
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "bpmndb"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bpmn-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bpmn-secrets
                  key: db-password
            - name: CAMUNDA_ADMIN_USER
              value: "admin"
            - name: CAMUNDA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bpmn-secrets
                  key: camunda-admin-password
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bpmn-secrets
                  key: openai-api-key
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bpmn-workflow
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "bpmndb"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bpmn-secrets
                  key: db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bpmn-secrets
                  key: db-password
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: bpmn-workflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

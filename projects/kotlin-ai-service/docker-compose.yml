version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-service-postgres
    environment:
      POSTGRES_DB: ai_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PLACEHOLDER_POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_service"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kotlin-ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kotlin-ai-service
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      DATABASE_URL: "jdbc:postgresql://postgres:5432/ai_service"
      DATABASE_USER: "postgres"
      DATABASE_PASSWORD: "PLACEHOLDER_POSTGRES_PASSWORD"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:

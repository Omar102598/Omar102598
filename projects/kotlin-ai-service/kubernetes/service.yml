apiVersion: v1
kind: Service
metadata:
  name: kotlin-ai-service
  namespace: default
  labels:
    app: kotlin-ai-service
spec:
  selector:
    app: kotlin-ai-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: kotlin-ai-service-nodeport
  namespace: default
  labels:
    app: kotlin-ai-service
spec:
  selector:
    app: kotlin-ai-service
  ports:
    - name: http
      protocol: TCP
      port: 8090
      targetPort: 8090
      nodePort: 30090
  type: NodePort

# ==============================================================================
# Infrastructure CI/CD Pipeline
# Multi-cloud deployment with environment gates and cost estimation
# ==============================================================================

name: Infrastructure Deployment

on:
  push:
    branches: [main]
    paths:
      - 'projects/cloud-infra-iac/**'
  pull_request:
    branches: [main]
    paths:
      - 'projects/cloud-infra-iac/**'
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Cloud provider'
        required: true
        type: choice
        options:
          - aws
          - azure
          - bicep
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Deployment action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TERRAFORM_VERSION: '1.6.6'
  WORKING_DIR: 'projects/cloud-infra-iac'

jobs:
  # ============================================================================
  # Validation
  # ============================================================================
  validate:
    name: Validate Infrastructure Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check - AWS
        run: terraform -chdir=terraform/aws fmt -check -recursive

      - name: Terraform Format Check - Azure
        run: terraform -chdir=terraform/azure fmt -check -recursive

      - name: Terraform Init & Validate - AWS
        run: |
          cd terraform/aws
          terraform init -backend=false
          terraform validate

      - name: Terraform Init & Validate - Azure
        run: |
          cd terraform/azure
          terraform init -backend=false
          terraform validate

      - name: Validate Bicep Templates
        if: runner.os == 'Linux'
        run: |
          az bicep build --file bicep/main.bicep || echo "Bicep CLI not available in CI"

      - name: Run Security Scan
        run: |
          chmod +x scripts/validate.sh
          # Run structure and security checks only (skip terraform commands)
          echo "Checking for hardcoded secrets..."
          if grep -rn --include="*.tf" --include="*.bicep" -E 'AKIA[0-9A-Z]{16}' .; then
            echo "::error::Potential AWS access key found in code"
            exit 1
          fi
          echo "Security scan passed"

  # ============================================================================
  # Cost Estimation
  # ============================================================================
  cost-estimate:
    name: Cost Estimation
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost JSON - AWS
        run: |
          cd terraform/aws
          terraform init -backend=false
          infracost breakdown \
            --path . \
            --format json \
            --out-file infracost-aws.json || echo "{}" > infracost-aws.json
        continue-on-error: true

      - name: Generate Infracost JSON - Azure
        run: |
          cd terraform/azure
          terraform init -backend=false
          infracost breakdown \
            --path . \
            --format json \
            --out-file infracost-azure.json || echo "{}" > infracost-azure.json
        continue-on-error: true

      - name: Post Infracost Comment
        uses: infracost/actions/comment@v3
        with:
          path: "${{ env.WORKING_DIR }}/terraform/aws/infracost-aws.json,${{ env.WORKING_DIR }}/terraform/azure/infracost-azure.json"
          behavior: update
        continue-on-error: true

  # ============================================================================
  # Terraform Plan
  # ============================================================================
  terraform-plan:
    name: "Terraform Plan (${{ matrix.cloud }})"
    runs-on: ubuntu-latest
    needs: validate
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    strategy:
      matrix:
        cloud: [aws, azure]
      fail-fast: false
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}/terraform/${{ matrix.cloud }}
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Azure Login
        if: matrix.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=${{ matrix.cloud }}/${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate"

      - name: Terraform Plan
        id: plan
        run: |
          terraform workspace select ${{ github.event.inputs.environment || 'dev' }} || \
            terraform workspace new ${{ github.event.inputs.environment || 'dev' }}
          terraform plan \
            -var="environment=${{ github.event.inputs.environment || 'dev' }}" \
            -out=tfplan \
            -no-color
        continue-on-error: true

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan - ${{ matrix.cloud }} 📖
            \`\`\`
            ${{ steps.plan.outputs.stdout || 'Plan output not available' }}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65536)
            });

  # ============================================================================
  # Terraform Apply
  # ============================================================================
  terraform-apply:
    name: "Terraform Apply (${{ github.event.inputs.cloud }})"
    runs-on: ubuntu-latest
    needs: validate
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'apply'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}/terraform/${{ github.event.inputs.cloud }}
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: "deploy-${{ github.event.inputs.cloud }}-${{ github.event.inputs.environment }}"
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        if: github.event.inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Azure Login
        if: github.event.inputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=${{ github.event.inputs.cloud }}/${{ github.event.inputs.environment }}/terraform.tfstate"

      - name: Terraform Apply
        run: |
          terraform workspace select ${{ github.event.inputs.environment }} || \
            terraform workspace new ${{ github.event.inputs.environment }}
          terraform apply \
            -var="environment=${{ github.event.inputs.environment }}" \
            -auto-approve

  # ============================================================================
  # Bicep Deploy
  # ============================================================================
  bicep-deploy:
    name: "Bicep Deploy (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    needs: validate
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.cloud == 'bicep' &&
      github.event.inputs.action == 'apply'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}/bicep
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: "deploy-bicep-${{ github.event.inputs.environment }}"
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        run: |
          az deployment sub validate \
            --location eastus \
            --template-file main.bicep \
            --parameters parameters/${{ github.event.inputs.environment }}.bicepparam

      - name: What-If Analysis
        run: |
          az deployment sub what-if \
            --location eastus \
            --template-file main.bicep \
            --parameters parameters/${{ github.event.inputs.environment }}.bicepparam

      - name: Deploy Bicep
        run: |
          az deployment sub create \
            --name "infra-${{ github.event.inputs.environment }}-${{ github.run_number }}" \
            --location eastus \
            --template-file main.bicep \
            --parameters parameters/${{ github.event.inputs.environment }}.bicepparam

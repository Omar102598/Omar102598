version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pm-postgres
    environment:
      POSTGRES_DB: pmdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PLACEHOLDER_POSTGRES_PASSWORD
    ports:
      - "5433:5432"
    volumes:
      - pm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pm-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pmdb
      DB_USERNAME: postgres
      DB_PASSWORD: PLACEHOLDER_POSTGRES_PASSWORD
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-angular:
    image: node:20-alpine
    container_name: pm-frontend-angular
    working_dir: /app
    volumes:
      - ./frontend-angular:/app
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --port 4200"
    depends_on:
      - backend
    ports:
      - "4200:4200"

  frontend-react:
    image: node:20-alpine
    container_name: pm-frontend-react
    working_dir: /app
    volumes:
      - ./frontend-react:/app
    command: sh -c "npm install && npm start"
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - CI=true

volumes:
  pm_postgres_data:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm-backend
  labels:
    app: pm-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pm-backend
  template:
    metadata:
      labels:
        app: pm-backend
    spec:
      containers:
        - name: pm-backend
          image: pm-backend:latest
          ports:
            - containerPort: 8090
          env:
            - name: DB_HOST
              value: pm-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: pmdb
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pm-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pm-db-secret
                  key: password
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pm-openai-secret
                  key: api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm-postgres
  labels:
    app: pm-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pm-postgres
  template:
    metadata:
      labels:
        app: pm-postgres
    spec:
      containers:
        - name: pm-postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pmdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pm-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pm-db-secret
                  key: password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: pm-postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pm-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
